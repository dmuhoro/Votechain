name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (compile + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile -w contracts
      - run: npm run test -w contracts

  backend:
    name: Backend (build + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile -w contracts
      - run: npm run test -w backend
      - name: Build backend
        env:
          PORT: "3001"
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-key
          RELAYER_PRIVATE_KEY: "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          OWNER_PRIVATE_KEY: "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcde0"
          SEPOLIA_RPC_URL: http://localhost:8545
          SEPOLIA_EXPLORER: https://sepolia.etherscan.io
          CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000001"
          SERVER_SECRET: ci-secret-that-is-at-least-thirty-two-chars
          ADMIN_EMAILS: admin@votechain.test
          CORS_ORIGIN: http://localhost:5173
        run: npm run build -w backend

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w frontend
      - name: Build frontend
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: anon-key
          VITE_API_URL: http://localhost:3001
          VITE_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000001"
          VITE_SEPOLIA_EXPLORER: https://sepolia.etherscan.io
        run: npm run build -w frontend